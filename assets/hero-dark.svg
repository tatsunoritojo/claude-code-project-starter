      <rect width="260" height="184" rx="24" fill="#101821" stroke="#27566A" stroke-width="2"/>
      <rect x="18" y="18" width="42" height="42" rx="13" fill="#123445"/>
      <text x="39" y="47" text-anchor="middle" fill="#67E8F9" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="850">2</text>
      <text x="76" y="48" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="23" font-weight="800">VERIFY</text>
      <text x="20" y="92" fill="#CBD5E1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">Acceptance → evidence</text>
      <text x="20" y="119" fill="#CBD5E1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">Checks tied to HEAD</text>
      <rect x="20" y="146" width="114" height="22" rx="11" fill="#102E3A"/>
      <text x="77" y="162" text-anchor="middle" fill="#67E8F9" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="800">EVIDENCE GATE</text>
    </g>

    <g transform="translate(656 332)">
      <rect width="260" height="184" rx="24" fill="#1A1219" stroke="#6D3342" stroke-width="2"/>
      <rect x="18" y="18" width="42" height="42" rx="13" fill="#48202C"/>
      <text x="39" y="47" text-anchor="middle" fill="#FDA4AF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="850">3</text>
      <text x="76" y="48" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="23" font-weight="800">CHALLENGE</text>
      <text x="20" y="92" fill="#CBD5E1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">Separate reviewer</text>
      <text x="20" y="119" fill="#CBD5E1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">Findings · exact SHA</text>
      <rect x="20" y="146" width="106" height="22" rx="11" fill="#3A1B25"/>
      <text x="73" y="162" text-anchor="middle" fill="#FDA4AF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="800">REVIEW GATE</text>
    </g>

    <g transform="translate(948 332)">
      <rect width="260" height="184" rx="24" fill="#1B1710" stroke="#6F5425" stroke-width="2"/>
      <rect x="18" y="18" width="42" height="42" rx="13" fill="#493512"/>
      <text x="39" y="47" text-anchor="middle" fill="#FCD34D" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="850">4</text>
      <text x="76" y="48" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="23" font-weight="800">DECIDE</text>
      <text x="20" y="92" fill="#CBD5E1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">Residual risk visible</text>
      <text x="20" y="119" fill="#CBD5E1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">Human merge authority</text>
      <rect x="20" y="146" width="106" height="22" rx="11" fill="#382A10"/>
      <text x="73" y="162" text-anchor="middle" fill="#FCD34D" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="800">HUMAN GATE</text>
    </g>
