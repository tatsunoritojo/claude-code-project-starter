      <rect x="18" y="18" width="42" height="42" rx="13" fill="#2E2150"/>
      <text x="39" y="47" text-anchor="middle" fill="#C4B5FD" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="850">1</text>
      <text x="76" y="48" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="23" font-weight="800">FRAME</text>
      <text x="20" y="92" fill="#CBD5E1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">Outcome · non-goals</text>
      <text x="20" y="119" fill="#CBD5E1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">Acceptance · base SHA</text>
      <rect x="20" y="146" width="94" height="22" rx="11" fill="#251B40"/>
      <text x="67" y="162" text-anchor="middle" fill="#C4B5FD" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="800">ENTRY GATE</text>
    </g>

