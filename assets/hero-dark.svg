  <g transform="translate(88 570)">
    <circle cx="8" cy="8" r="8" fill="#A78BFA"/>
    <path d="M4 8L7 11L12.5 5.5" stroke="#0B0C14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="26" y="14" fill="#AAB6C5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650">Plugin-first · reversible · evidence before claims</text>
  </g>
