<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Reliable Ship for Claude Code</title>
  <desc id="desc">Build fast, review independently, and merge deliberately through four explicit workflow gates.</desc>
  <defs>
    <linearGradient id="bg" x1="50" y1="10" x2="1220" y2="650" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070A12"/>
      <stop offset="0.52" stop-color="#111027"/>
      <stop offset="1" stop-color="#071B25"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="90" y1="105" x2="655" y2="185" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C4B5FD"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#A78BFA" fill-opacity="0.13"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" rx="30" fill="url(#bg)"/>
  <rect width="1280" height="640" rx="30" fill="url(#dots)"/>
  <circle cx="1120" cy="82" r="190" fill="#22D3EE" fill-opacity="0.08"/>
  <circle cx="1190" cy="10" r="120" fill="#8B5CF6" fill-opacity="0.12"/>
  <path d="M1020 144C1095 80 1168 92 1248 154" stroke="#A78BFA" stroke-width="2" stroke-opacity="0.24" stroke-dasharray="7 10"/>
  <path d="M1005 170C1097 92 1190 112 1265 185" stroke="#22D3EE" stroke-width="2" stroke-opacity="0.18" stroke-dasharray="7 10"/>

  <g transform="translate(88 72)">
    <rect width="238" height="36" rx="18" fill="#17152B" stroke="#4C3B77"/>
    <circle cx="19" cy="18" r="6" fill="#A78BFA"/>
    <text x="35" y="23" fill="#DDD6FE" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1.3">CLAUDE CODE WORKFLOW</text>
  </g>

  <text x="88" y="185" fill="url(#wordmark)" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="72" font-weight="850" letter-spacing="-2">RELIABLE SHIP</text>
  <text x="91" y="235" fill="#E2E8F0" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="27" font-weight="650">Build fast. Review independently. Merge deliberately.</text>
  <text x="91" y="276" fill="#94A3B8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18">Four explicit gates. One immutable review target. A human final decision.</text>

  <g transform="translate(946 75)">
    <rect width="238" height="104" rx="22" fill="#0B1220" stroke="#26354B"/>
    <text x="24" y="34" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">review.target</text>
    <text x="24" y="61" fill="#F8FAFC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">HEAD  8f31...c92a</text>
    <circle cx="28" cy="82" r="5" fill="#34D399"/>
    <text x="42" y="87" fill="#6EE7B7" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700">SHA MATCH</text>
  </g>

  <path d="M208 379H1070" stroke="#334155" stroke-width="3"/>
  <path d="M1070 379L1055 370V388L1070 379Z" fill="#64748B"/>

